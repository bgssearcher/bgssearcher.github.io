<html lang="ja">
<head>

  <title>青看板検索ツール</title>
  <meta name="description" content="日本全国の青看板を地名や道路種別（国道・県道）、形状、地図から検索できるツールです。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link rel="canonical" href="https://sesso-richu.github.io/bgssearcher/">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    .main-content{
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h2 {
      color: #2c3e50;
      margin: 0 0 15px 0;
      font-size: 18px;
      text-align: center;
    }
    .search-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }    
    input[type="text"] {
      flex: 1;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box; 
    }    
    input[type="text"]:focus {
      border-color: #3498db;
      outline: none;
    }
    .filter-select-wrapper {
      display: flex;
      gap: 10px;
    }
    .filter-select-wrapper select {
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background-color: #fff;
      box-sizing: border-box;
      color: #333;
      cursor: pointer;
    }
    .filter-select-wrapper select:focus {
      border-color:#3498db;
      outline: none;
    }
    .content-wrapper {
      display: flex;
      flex-direction: row;
      gap: 15px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }   
    .list-container {
      width: 50%;
      min-width: 50%;
      max-width: 50%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
      box-sizing: border-box;
    }
    .data-card { display: flex;  background: white; border-radius: 8px; overflow: hidden; box-shadow: none; border: 1px solid #eef2f5; cursor: pointer; height: auto; box-sizing: border-box; flex-shrink: 0; }   
    .card-img { width: 100px; height: 100px; object-fit: cover; background: #eaeded; flex-shrink: 0; }   
    .card-info { padding: 10px; display: flex; flex-direction: column; justify-content: center; gap: 4px; flex-grow: 1; overflow: hidden; }
    .data-card.active .card-info { justify-content: flex-start; }
    .card-name { font-size: 14px; font-weight: bold; color: #2c3e50; margin: 0; }
    .card-address { font-size: 12px; color: #7f8c8d; margin: 0; }   
    .card-detail { font-size: 12px; color: #34495e; margin: 4px 0 0 0; padding-top: 4px; border-top: 1px dashed #ddd; display: none; padding-right: 5px; word-break: break-all; }
    .data-card.active .card-detail { display: block; }    
    .search-container { text-align: left; }
   
    #map { flex: 1; height: 100%; border-radius: 8px; border: 1px solid #eef2f5; outline: none; }
   
    .no-data { text-align: center; padding: 40px; background: white; border-radius: 8px; color: #7f8c8d; font-size: 14px; width: 100%; box-sizing: border-box; }
    #imageViewer { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
    #imageViewer.show { display: flex; }
    #viewerImage { max-width: 90%; max-height: 90%; border-radius: 4px; }

    .data-card.highlight { background: #fff6e4; border: 1px solid #ffe1b3; }

    #advancedSearchBtn {
      background: #ecf0f1; border: 2px solid #bdc3c7; color: #2c3e50;
      border-radius: 8px; padding: 10px; font-size: 16px;
      box-sizing: border-box; cursor: pointer; white-space: nowrap;
      transition: background 0.2s;
    }
    #advancedSearchBtn:hover { background: #dfe6e9; }

    .modal-overlay {
      display: none; position: fixed; z-index: 9999; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
      background: #fff; width: 90%; max-width: 600px;
      height: 90vh; border-radius: 12px; display: flex;
      flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 15px 20px; border-bottom: 1px solid #ddd;
      display: flex; justify-content: space-between; align-items: center;
      background: #eef2f5; flex-shrink: 0;
    }
    .modal-close { font-size: 28px; cursor: pointer; color: #7f8c8d; line-height: 1; }
    
    /* 中身だけがスクロールする設定 */
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #34495e; }
    .form-row-2col { display: flex; gap: 15px; }
    .form-row-2col .form-group { flex: 1; }
    .modal-body input[type="text"], .modal-body select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; background-color: #ffffff;
    }

    /* チェックボックス */
    .feature-section-title { font-size: 13px; color: #7f8c8d; margin: 10px 0 5px 0; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .feature-card { cursor: pointer; display: block; position: relative; }
    .feature-card input[type="checkbox"] { position: absolute; top: 0; left: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 10; margin: 0; }
    .card-content {
      border: 2px solid #ddd; border-radius: 8px; padding: 10px 5px; text-align: center;
      transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; box-sizing: border-box; background: #ffffff;
    }
    .card-content img { width: 100%; max-height: 50px; object-fit: contain; margin-bottom: 5px; }
    .card-content span { font-size: 12px; font-weight: bold; color: #2c3e50; }
    /* チェックされた時の見た目 */
    .feature-card input[type="checkbox"]:checked + .card-content {
      border-color: #3498db; background: #ebf5fb; color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }
    .card-content.is-active {
      border-color: #3498db; background: #ebf5fb; color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }
    .modal-footer {
      padding: 15px 20px; border-top: 1px solid #ddd; background: #fff; flex-shrink: 0; text-align: right;
    }
    .clear-btn {
      background: #bdc3c7; color: #2c3e50; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
      border-radius: 8px; cursor: pointer; flex: 1; transition: background 0.2s;
    }
    .clear-btn:hover { background: #b2bec3; }
    .apply-btn {
      background: #3498db; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold;
      border-radius: 8px; cursor: pointer; flex: 2; transition: background 0.2s;
    }
    .apply-btn:hover { background: #2980b9; }

    .custom-header {
      background-image: url('https://i.ibb.co/zh21tn7g/IMG-2912.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      color: white;
      padding: 8px 20px;
    }
    .custom-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }
    .header-container {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .header-title {
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 1px;
    }
    .header-nav {
      display: flex;
      gap: 20px;
    }
    .header-nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .header-nav a:hover {
      opacity: 0.7;
    } 
    .custom-square-marker {
      background-color: #3250a8;
      border: 1px solid #ffffff;
      border-radius: 0;
      box-sizing: border-box;
    }
    .custom-square-marker.selected {
      background-color: #ff850a !important;
      z-index: 1000 !important;
    }
    .locate-button {
      background-color: #fff;
      width: 30px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      cursor: pointer;
      border-radius: 4px;
      font-size: 18px;
      display: block;
    }
    .locate-button:hover {
      background-color: #ffffff;
    }
    
    @media screen and (max-width: 768px) {
      body { height: 100dvh; min-height: 0; overflow: hidden; margin: 0; padding: 0; display: flex; flex-direction: column; }
      body .custom-header { padding: 4px 10px; }
      body .header-container { display: flex; justify-content: space-between; align-items: center; }
      body .header-title { font-size: 18px; }
      body .header-nav { gap: 10px; }
      body .header-nav a { font-size: 11px; padding: 4px 8px; border-radius: 4px; }
      body .main-content { padding: 0;  margin: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; }
      body .search-container { display: flex; flex-direction: row; align-items: stretch; gap: 6px; margin: 6px 6px 4px 6px; padding: 0; height: 40px; }
      body .search-container input[type="text"] { flex: 1; max-width: none; padding: 0 10px; font-size: 14px; height: 100%;  box-sizing: border-box; margin: 0; }
      body .filter-select-wrapper { width: 100%; gap: 4px; }
      body .filter-select-wrapper select { flex: 1; width: 50%; padding: 6px 4px; font-size: 12px; height: auto; }
      body .content-wrapper { display: flex; flex-direction: column-reverse; flex: 1; min-height: 0; gap: 4px; margin: 0 6px 6px 6px; width: auto; height: auto; max-height: none; }    
      body #map { width: 100%; height: 45dvh; flex: none; margin: 0; }    
      body .list-container { width: 100%; min-width: 100%; max-width: 100%; height: auto; max-height: none; flex: 1; min-height: 0;  padding: 0; overflow-y: auto; }
      #advancedSearchBtn { width: auto; padding: 0 12px; height: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; margin: 0; }
      .modal-content { width: 95%; height: 85vh; }
      .checkbox-grid { grid-template-columns: repeat(3, 1fr); }
      input[type="text"],select { font-size: 16px !important; }
    }
  </style>

<body>
  <header class="custom-header">
    <div class="header-container">
      <h1 class="header-title">青看板検索ツール</h1>
      <nav class="header-nav">
        <a href="./">マップ検索</a>
        <a href="about.html">about</a>
      </nav>
    </div>
  </header>

  <div class="main-content">

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="地名を入力…(ｶﾝﾏ,ｽﾍﾟｰｽ区切り可)" oninput="filterData()">
    <button id="advancedSearchBtn" onclick="openAdvancedSearch()">
      <span style="font-size: 15px; font-weight: bold;">詳細検索</span>
    </button>
  </div>

  <div class="content-wrapper">
    <div class="list-container" id="listContainer">
      <div class="no-data">読み込み中…</div>
    </div>
    <div id="map"></div>
  </div>

  <div id="imageViewer" onclick="closeViewer()">
    <img id="viewerImage" src="" alt="拡大画像">
  </div>

  <div id="advancedSearchModal" class="modal-overlay" onclick="closeAdvancedSearch(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 style="margin:0; font-size:20px; color:#2c3e50;">詳細検索</h2>
        <span class="modal-close" onclick="closeAdvancedSearch()">×</span>
      </div>
      
      <div class="modal-body">
        
        <div class="form-row-2col">
          <div class="form-group">
            <label>都道府県</label>
            <select id="advPrefecture">
              <option value="">すべて</option>
              <option value="埼玉県">埼玉県</option><option value="千葉県">千葉県</option><option value="東京都">東京都</option><option value="神奈川県">神奈川県</option>
              <option value="石川県">石川県</option><option value="山梨県">山梨県</option><option value="岐阜県">岐阜県</option><option value="静岡県">静岡県</option>
              <option value="京都府">京都府</option>
            </select>
          </div>
          <div class="form-group">
            <label>道路種別</label>
            <select id="advRoadType">
              <option value="">すべて</option>
              <option value="国道">国道</option>
              <option value="県道">都道府県道</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>道路名</label>
            <div style="display: flex; align-items: center; gap: 5px;">
              <input type="text" id="advRoadNameInput" placeholder="例: 1" style="flex: 1;">
              <span style="font-weight: bold; white-space: nowrap; margin-top: 2px; font-size: 0.85em; color: #34495e;">（号）</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>住所</label>
          <input type="text" id="advAddress" placeholder="住所の一部か全部を入力">
        </div>

        <div class="form-group">
          <label>交差路線</label>
          <input type="text" id="advCrossRoad" placeholder="例: 国道1号,日比谷通り">
        </div>
        
        <div class="form-group">
          <label>高速道路案内</label>
          <input type="text" id="advHighway" placeholder="ﾅﾝﾊﾞﾘﾝｸﾞや道路名を入力（例: E1,東名高速）">
        </div>

        <div class="form-group">
          <label style="margin-bottom: 5px;">特徴</label>
          
          <div class="feature-section-title">《形状》</div>
          <div class="checkbox-grid">
            <div class="feature-card"><input type="checkbox" name="advFeature" value="分割"><div class="card-content"><img src="img/shape1.jpg" alt="画像" onerror="this.style.display='none'"><span>分割</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="シンボル"><div class="card-content"><img src="img/shape2.jpg" alt="画像" onerror="this.style.display='none'"><span>シンボル</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="電光"><div class="card-content"><img src="img/shape3.jpg" alt="画像" onerror="this.style.display='none'"><span>電光</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="車高"><div class="card-content"><img src="img/height.png" alt="画像" onerror="this.style.display='none'"><span>車高制限</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="車種"><div class="card-content"><img src="img/type.png" alt="画像" onerror="this.style.display='none'"><span>車種制限</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="禁止"><div class="card-content"><img src="img/keepout.png" alt="画像" onerror="this.style.display='none'"><span>進入禁止</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="標識"><div class="card-content"><img src="img/elsemark.png" alt="画像" onerror="this.style.display='none'"><span>他標識</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="信号"><div class="card-content"><img src="img/signal.png" alt="画像" onerror="this.style.display='none'"><span>信号</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="駅"><div class="card-content"><img src="img/station.png" alt="画像" onerror="this.style.display='none'"><span>駅</span></div></div>
          </div>

          <div class="feature-section-title">《概形》</div>
          <div class="checkbox-grid">
            <div class="feature-card"><input type="checkbox" name="advFeature" value="交差なし"><div class="card-content"><img src="img/crossimg_1.png" alt="画像" onerror="this.style.display='none'"><span>交差なし</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="T字路"><div class="card-content"><img src="img/crossimg_stp.png" alt="画像" onerror="this.style.display='none'"><span>T字路</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="2交差"><div class="card-content"><img src="img/crossimg_2.png" alt="画像" onerror="this.style.display='none'"><span>2交差</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="3交差以上"><div class="card-content"><img src="img/crossimg_3.png" alt="画像" onerror="this.style.display='none'"><span>3交差以上</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="ランプ"><div class="card-content"><img src="img/ramp.png" alt="画像" onerror="this.style.display='none'"><span>ランプ</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="線路"><div class="card-content"><img src="img/rail.png" alt="画像" onerror="this.style.display='none'"><span>線路</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="橋梁"><div class="card-content"><img src="img/bridge.png" alt="画像" onerror="this.style.display='none'"><span>橋梁</span></div></div>
            <div class="feature-card"><input type="checkbox" name="advFeature" value="矢印なし"><div class="card-content"><img src="img/crossimg_x.png" alt="画像" onerror="this.style.display='none'"><span>矢印なし</span></div></div>
          </div>
        </div>

      </div>
      
      <div class="modal-footer">
        <button class="apply-btn" onclick="applyAdvancedSearch()">適用</button>
        <button class="clear-btn" onclick="clearAdvancedSearch()">条件をクリア</button>
      </div>
    </div>
  </div>

  <script>
    let allData = [];
    let map;
    let markerGroup;

    let currentFilteredData = [];
    let currentDisplayCount = 0;
    const CHUNK_SIZE = 30;

    function initMap() {
      map = L.map('map', { zooming: true, touchZoom: true }).setView([35.6812, 139.7671], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      markerGroup = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 80,
        disableClusteringAtZoom: 11,
        animate: false
      }).addTo(map);

      const locateControl = L.control({ position: 'topleft' });

      locateControl.onAdd = function (map) {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = '<a class="locate-button" title="現在地を表示">📍</a>';
        
        div.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          map.locate({ setView: true, maxZoom: 16, enableHighAccuracy: false, timeout: 15000, maximumAge: 10000 });
        });
        return div;
      };
      
      locateControl.addTo(map);
      let currentLocMarker, currentLocCircle;
      map.on('locationfound', function (e) {
        if (currentLocMarker) map.removeLayer(currentLocMarker);
        if (currentLocCircle) map.removeLayer(currentLocCircle);
        currentLocMarker = L.marker(e.latlng).addTo(map)
        currentLocCircle = L.circle(e.latlng, e.accuracy).addTo(map);
      });
      
      map.on('locationerror', function (e) {
        alert("位置情報の取得に失敗しました。端末のGPS設定やブラウザの権限を確認してください。");
      });
    }

    window.onload = async function() {
      initMap();
      
      document.getElementById('listContainer').addEventListener('scroll', function() {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 100) {
          if (currentDisplayCount < currentFilteredData.length) {
            renderListChunk();
          }
        }
      });

      try {
        const dataUrl = 'https://docs.google.com/spreadsheets/d/11TIskUDnOrnWfnyXt9-IrFuSRRQHhpLTxjcQ1U6GXes/gviz/tq?tqx=out:json&sheet=シート1';      
        const response = await fetch(dataUrl);
        const text = await response.text();      
        const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const obj = JSON.parse(jsonStr);
        const table = obj.table;      
        let headers = [];
        let dataRows = [];
        
        if (table.cols && table.cols.some(c => c.label)) {
          headers = table.cols.map(c => c.label ? String(c.label).trim() : '');
          dataRows = table.rows;
        } else {
          headers = table.rows[0].c.map(cell => cell ? (cell.v !== null ? String(cell.v).trim() : '') : '');
          dataRows = table.rows.slice(1);
        }

        const formattedData = dataRows.map(row => {
          if (!row || !row.c) return null;
          const item = {};
          row.c.forEach((cell, index) => {
            const header = headers[index];
            if (header) {
              item[header] = cell ? (cell.v !== null ? String(cell.v) : '') : '';
            }
          });
          if (item['座標']) {
            const coords = String(item['座標']).split(/[、,，\s]+/);
            if (coords.length >= 2) {
              item['緯度'] = parseFloat(coords[0]);
              item['経度'] = parseFloat(coords[1]);
            }
          }
          item['名称'] = item['道路名'] || item['地名'] || '無名のスポット';
          return item;
        }).filter(item => item !== null && !isNaN(item['緯度']) && !isNaN(item['経度']));

        if (formattedData.length === 0) throw new Error('表示できるデータが0件です');

        allData = formattedData;
        filterData();

      } catch (err) {
        document.getElementById('listContainer').innerHTML = '<div class="no-data" style="color:red;">エラー: ' + err.message + '</div>';
      }
    };

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function() {
     clearTimeout(searchTimeout);
     searchTimeout = setTimeout(() => {
       filterData();
     }, 300);
    });

    function filterData() {
      const keyword = (document.getElementById('searchInput')?.value || '');
      const searchWords = keyword.trim() ? keyword.toLowerCase().split(/[\s,、]+/) : [];

      const prefecture = document.getElementById('advPrefecture')?.value || '';
      const roadType = document.getElementById('advRoadType')?.value || '';
      const roadNameInput = (document.getElementById('advRoadNameInput')?.value || '').toLowerCase();
      const addressRaw = document.getElementById('advAddress')?.value || '';
      const addressWords = addressRaw.trim() ? addressRaw.toLowerCase().split(/[\s,、]+/) : [];
      const crossRoadRaw = document.getElementById('advCrossRoad')?.value || '';
      const crossRoadWords = crossRoadRaw.trim() ? crossRoadRaw.toLowerCase().split(/[\s,、]+/) : [];
      const highwayRaw = document.getElementById('advHighway')?.value || '';
      const highwayWords = highwayRaw.trim() ? highwayRaw.toLowerCase().split(/[\s,、]+/) : [];
      
      const featureCheckboxes = document.querySelectorAll('input[name="advFeature"]:checked');
      const selectedFeatures = Array.from(featureCheckboxes).map(cb => cb.value);

      const filtered = allData.filter(function(row) {
        if (!row) return false;
        const desc = (row['地名'] || '').toString().toLowerCase();
        const matchKeyword = searchWords.length === 0 || searchWords.every(word => desc.indexOf(word) !== -1);
        const matchPrefecture = !prefecture || (row['都道府県'] || '') === prefecture;
        const matchRoadType = !roadType || (row['道路種別'] || '') === roadType;
        const matchRoadNameInput = !roadNameInput || (row['道路名'] || '').toString().toLowerCase().indexOf(roadNameInput) !== -1;
        const matchAddress = addressWords.length === 0 || addressWords.every(word => (row['住所'] || '').toString().toLowerCase().indexOf(word) !== -1);
        const matchCrossRoad = crossRoadWords.length === 0 || crossRoadWords.every(word => (row['交差路線'] || '').toString().toLowerCase().indexOf(word) !== -1);
        const matchHighway = highwayWords.length === 0 || highwayWords.every(word => (row['高速'] || '').toString().toLowerCase().indexOf(word) !== -1);
        const rowFeature = (row['特徴'] || '').toString();
        const matchFeature = selectedFeatures.length === 0 || selectedFeatures.every(feat => rowFeature.indexOf(feat) !== -1);
        return matchKeyword && matchPrefecture && matchRoadType && matchRoadNameInput && matchAddress && matchCrossRoad && matchHighway && matchFeature;
      });
      renderData(filtered);
    }

    function renderData(data) {
      currentFilteredData = data;
      currentDisplayCount = 0;
      
      const listContainer = document.getElementById('listContainer');
      listContainer.innerHTML = '';
      markerGroup.clearLayers();
      
      if (!data || data.length === 0) {
        listContainer.innerHTML = '<div class="no-data">該当するデータがありません</div>';
        return;
      }

      const bounds = [];
      const markers = []; 
      
      currentFilteredData.forEach(function(row, index) {
        if (!row['緯度'] || !row['経度']) return;

        const squareIcon = L.divIcon({
          className: 'custom-square-marker',
          iconSize: [12, 12],
          iconAnchor: [6, 6]
        });
        
        const marker = L.marker([row['緯度'], row['経度']], { icon: squareIcon });
        row._marker = marker;

        marker.on('click', function() {
          while (currentDisplayCount <= index && currentDisplayCount < currentFilteredData.length) {
            renderListChunk();
          }
          
          document.querySelectorAll('.data-card.active').forEach(c => c.classList.remove('active', 'highlight'));
          document.querySelectorAll('.custom-square-marker').forEach(m => m.classList.remove('selected'));
          
          const targetCard = document.getElementById('card-' + index);
          if (targetCard) {
            targetCard.classList.add('active', 'highlight');
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
          
          const iconElement = marker.getElement();
          if (iconElement) iconElement.classList.add('selected');
        });

        markers.push(marker);
        bounds.push([row['緯度'], row['経度']]);
      });

      markerGroup.addLayers(markers);

      if (bounds.length > 0 && map) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
      renderListChunk();
    }

    function renderListChunk() {
      const listContainer = document.getElementById('listContainer');
      const fragment = document.createDocumentFragment();
      const end = Math.min(currentDisplayCount + CHUNK_SIZE, currentFilteredData.length);

      for (let i = currentDisplayCount; i < end; i++) {
        const row = currentFilteredData[i];
        const imgUrl = row['画像'] ? row['画像'].toString() : 'https://placehold.co/120x120?text=No+Image';

        const card = document.createElement('div');
        card.className = 'data-card';
        card.id = 'card-' + i;
       
        const img = document.createElement('img');
        img.className = 'card-img';
        img.src = imgUrl;
        img.onerror = function() { this.src = 'https://placehold.co/120x120?text=Error'; };
        img.onclick = function(e) { openViewer(imgUrl); e.stopPropagation(); };
        card.appendChild(img);
       
        const info = document.createElement('div');
        info.className = 'card-info';
       
        const h3 = document.createElement('h3');
        h3.className = 'card-name';
        h3.innerText = row['道路名'] || '名称未設定';
        info.appendChild(h3);
       
        const p = document.createElement('p');
        p.className = 'card-address';
        p.innerText = row['住所'] || '住所未設定';
        info.appendChild(p);
       
        card.appendChild(info);

        let displayDate = row['撮影日'] || '-';
        if (displayDate.indexOf('Date(') !== -1) {
          const matches = displayDate.match(/Date\((\d+),(\d+),(\d+)/);
          if (matches) {
            displayDate = matches[1] + '年' + String(Number(matches[2]) + 1).padStart(2, '0') + '月' + matches[3].padStart(2, '0') + '日';
          }
        }

        const detailDiv = document.createElement('div');
        detailDiv.className = 'card-detail';
        detailDiv.innerHTML = '<b>座標:</b> ' + (row['座標'] || '-') + '<br><b>地名:</b> ' + (row['地名'] || '-') + '<br><b>撮影日:</b> ' + displayDate;
        info.appendChild(detailDiv);

        card.addEventListener('click', function() {
          document.querySelectorAll('.data-card.active').forEach(c => { 
            if (c !== card) c.classList.remove('active', 'highlight'); 
          });
          
          document.querySelectorAll('.custom-square-marker').forEach(m => m.classList.remove('selected'));     
          const isActive = card.classList.toggle('active');
          
          if (isActive) {
            card.classList.add('highlight');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            if (row['緯度'] && row['経度']) {
              map.setView([row['緯度'], row['経度']], 16);
              if (row._marker) {
                markerGroup.zoomToShowLayer(row._marker, function() {
                  const iconElement = row._marker.getElement();
                  if (iconElement) iconElement.classList.add('selected');
                });
              }
            }
          } else {
            card.classList.remove('highlight');
            if (row._marker && row._marker.getElement()) {
              row._marker.getElement().classList.remove('selected');
            }
          }
        });
        fragment.appendChild(card);
      }
      
      listContainer.appendChild(fragment);
      currentDisplayCount = end;
    }
    
    function openViewer(src) {
      if (src.indexOf('placehold.co') !== -1) return;
      const viewer = document.getElementById('imageViewer');
      const img = document.getElementById('viewerImage');
      img.src = src;
      viewer.classList.add('show');
    }
    function closeViewer() {
      document.getElementById('imageViewer').classList.remove('show');
    }
    function syncCheckboxStyles() {
      const checkboxes = document.querySelectorAll('input[name="advFeature"]');
      checkboxes.forEach(function(cb) {
        const cardContent = cb.nextElementSibling;
        if (cardContent) {
          if (cb.checked) {
            cardContent.classList.add('is-active');
          } else {
            cardContent.classList.remove('is-active');
          }
        }
      });
    }
    // モーダルの制御
    function openAdvancedSearch() {
      document.getElementById('advancedSearchModal').classList.add('show');
      syncCheckboxStyles();
    }
    function closeAdvancedSearch(e) {
      // 背景クリックで閉じる処理
      if (e && e.target !== document.getElementById('advancedSearchModal') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('advancedSearchModal').classList.remove('show');
    }
    function clearAdvancedSearch() {
      if (document.getElementById('advPrefecture')) document.getElementById('advPrefecture').value = '';
      if (document.getElementById('advRoadType')) document.getElementById('advRoadType').value = '';
      if (document.getElementById('advRoadNameInput')) document.getElementById('advRoadNameInput').value = '';
      if (document.getElementById('advAddress')) document.getElementById('advAddress').value = '';
      if (document.getElementById('advCrossRoad')) document.getElementById('advCrossRoad').value = '';
      if (document.getElementById('advHighway')) document.getElementById('advHighway').value = '';
      const checkboxes = document.querySelectorAll('input[name="advFeature"]');
      checkboxes.forEach(function(cb) {
        cb.checked = false;
      });
      syncCheckboxStyles();
      filterData();
    }
    function applyAdvancedSearch() {
      closeAdvancedSearch();
      filterData(); // 適用ボタンを押したらフィルタリングを実行
    }
    document.addEventListener('change', function(e) {
      if (e.target && e.target.name === 'advFeature') {
        syncCheckboxStyles();
      }
    });
  </script>
</body>
</html>
